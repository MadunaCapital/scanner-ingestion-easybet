name: Deploy to Azure Container Apps

on:
  push:
    branches: [main]

env:
  ACR_NAME: arbitragescannerregistryza
  IMAGE_NAME: scanner-ingestion-easybet
  CONTAINER_APP_NAME: arbitrage-scanner-easybet
  RESOURCE_GROUP: arbitrage-scanner-rg

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Plain docker build+push on the runner itself, NOT `az acr build`:
      # the original Azure for Students subscription had ACR Tasks (remote
      # builds) disabled by policy, and a runner build works on any
      # subscription, so it stayed this way after the move to South Africa North.
      - name: Build image
        run: docker build -t $ACR_NAME.azurecr.io/$IMAGE_NAME:${{ github.sha }} -t $ACR_NAME.azurecr.io/$IMAGE_NAME:latest .

      - name: Push image to ACR
        run: |
          az acr login --name $ACR_NAME
          docker push $ACR_NAME.azurecr.io/$IMAGE_NAME:${{ github.sha }}
          docker push $ACR_NAME.azurecr.io/$IMAGE_NAME:latest

      # Expected to fail until the Container App itself has been created.
      - name: Deploy new image to Container App
        run: |
          az containerapp update \
            --name $CONTAINER_APP_NAME \
            --resource-group $RESOURCE_GROUP \
            --image $ACR_NAME.azurecr.io/$IMAGE_NAME:${{ github.sha }}
