[project]
name = "maduna-scanner-ingestion-easybet"
version = "0.1.0"
description = "Easybet odds scraper for the MadunaCapital arbitrage scanner"
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
timeout = 15
asyncio_mode = "auto"
